# Memory-constrained host (8GB RAM): cap the Gradle and Kotlin daemon heaps
# so builds can never squeeze out the rest of the system. The build cache
# itself lives on disk (GRADLE_USER_HOME), not in RAM. Do NOT raise these.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
